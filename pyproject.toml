[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlite-hy3"
version = "0.1.0"
description = "Tencent Hy3 as an external model package for Megatron Lite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ISEEKYAN" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest>=8", "safetensors>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  "mlite: Megatron Lite tests",
  "smoke: integration smoke tests",
  "gpu: requires CUDA",
  "distributed: requires torch.distributed",
]
